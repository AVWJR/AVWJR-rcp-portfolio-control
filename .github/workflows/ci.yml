name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Push schema
        run: npm run db:push
      - name: Seed demo books
        run: npx tsx prisma/seed.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
