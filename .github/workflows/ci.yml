name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      TZ: America/New_York
      LEGACY_PARTNER_TOKEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Push schema
        run: npm run db:push
      - name: Seed demo books
        run: npx tsx prisma/seed.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  backup-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create scratch databases
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE rcp_drill_source;"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE rcp_drill_target;"
      - name: Backup and restore drill
        env:
          SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rcp_drill_source
          TARGET_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rcp_drill_target
          BACKUP_ENCRYPTION_KEY: ci-drill-passphrase
        run: bash scripts/restore-drill.sh
